[project]
name = "marketpulse-api"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"alembic/**" = ["N999"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

# pandas-stubs types index labels as Hashable, which makes idiomatic
# date-indexed code noisy; these checks stay on everywhere else.
[[tool.mypy.overrides]]
module = ["app.analytics.*", "app.providers.*", "app.services.*", "app.api.*"]
disable_error_code = ["call-overload", "arg-type", "no-any-return", "index", "attr-defined"]

[[tool.mypy.overrides]]
module = ["yfinance", "yfinance.*", "statsmodels", "statsmodels.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs a running Postgres (DATABASE_URL)"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["app", "jobs"]
