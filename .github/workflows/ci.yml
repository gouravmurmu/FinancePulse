name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.invalid

  api:
    name: API (lint, types, tests incl. RLS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marketpulse_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/marketpulse_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - name: Load Supabase auth stub
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f ../infra/postgres/00-supabase-stub.sql
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app jobs
      - run: pytest -q
      - name: Migrations match models
        run: DATABASE_URL="$TEST_DATABASE_URL" alembic upgrade head && DATABASE_URL="$TEST_DATABASE_URL" alembic check

  e2e:
    name: Browser end-to-end (seeded data)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marketpulse_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/marketpulse_e2e
      SUPABASE_JWT_SECRET: ci-e2e-secret-at-least-32-bytes-long-x
      E2E_JWT_SECRET: ci-e2e-secret-at-least-32-bytes-long-x
      CORS_ORIGINS: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_SUPABASE_URL: https://fake.supabase.test
      NEXT_PUBLIC_SUPABASE_ANON_KEY: e2e-anon
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install API
        working-directory: backend
        run: pip install -r requirements/api.txt
      - name: Seed synthetic data
        working-directory: backend
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../infra/postgres/00-supabase-stub.sql
          PYTHONPATH=. python scripts/seed_e2e.py
      - name: Start API
        working-directory: backend
        run: nohup uvicorn app.main:app --port 8000 > /tmp/api.log 2>&1 &
      - name: Build and start web
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          nohup npm start -- -p 3000 > /tmp/web.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf localhost:8000/api/v1/health > /dev/null && curl -sf localhost:3000 > /dev/null && break
            sleep 2
          done
      - name: Run Playwright
        working-directory: frontend
        run: npm run e2e
      - name: Server logs
        if: failure()
        run: tail -n 100 /tmp/api.log /tmp/web.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  api-image:
    name: API Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t marketpulse-api backend
