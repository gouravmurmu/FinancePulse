name: Forecasts

# Baseline forecasts with walk-forward evaluation, once a day after the
# evening market data refresh (22:30 UTC). See docs/MODELS.md.
on:
  schedule:
    - cron: "15 23 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Space-separated instrument IDs (blank = all)"
        type: string
        default: ""

concurrency:
  group: forecasts
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: pip install -r requirements/jobs.txt
      - name: Check secrets
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add the DATABASE_URL repository secret (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - name: Apply migrations
        run: alembic upgrade head
      - name: Forecast
        env:
          ONLY: ${{ inputs.only }}
        run: |
          if [ -n "$ONLY" ]; then python -m jobs.run_forecasts --only $ONLY; else python -m jobs.run_forecasts; fi
