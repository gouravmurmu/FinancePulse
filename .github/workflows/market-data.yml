name: Market data refresh

# Daily bars are refreshed twice a day (weekdays and weekends, because crypto
# trades every day):
#   11:00 UTC  after Indian markets close (15:30 IST)
#   22:30 UTC  after US markets close
# The UI states this schedule; nothing in MarketPulse is real-time.
on:
  schedule:
    - cron: "0 11 * * *"
    - cron: "30 22 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Refetch full history (5 years)"
        type: boolean
        default: false
      only:
        description: "Space-separated instrument IDs (blank = all)"
        type: string
        default: ""

concurrency:
  group: market-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: pip install -r requirements/jobs.txt
      - name: Check secrets
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add the DATABASE_URL repository secret (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - name: Apply migrations
        run: alembic upgrade head
      - name: Refresh
        run: |
          ARGS=""
          if [ "${{ inputs.backfill }}" = "true" ]; then ARGS="$ARGS --backfill"; fi
          if [ -n "${{ inputs.only }}" ]; then ARGS="$ARGS --only ${{ inputs.only }}"; fi
          python -m jobs.refresh_market_data $ARGS
