name: Live smoke test

# Read-only checks against the deployed site: the API answers, the scheduled
# data jobs are on time, and key pages render real data. A failure here sends
# the usual GitHub failed-workflow email, which is the uptime alert.
on:
  schedule:
    - cron: "30 12 * * *" # after the 11:00 UTC data refresh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      E2E_BASE_URL: https://marketpulse-grv4.vercel.app
      E2E_API_URL: https://marketpulse-api-kp70.onrender.com
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wake the API (free tier sleeps when idle)
        run: curl -s --retry 6 --retry-delay 20 --retry-all-errors --max-time 90 "$E2E_API_URL/api/v1/health" || true
      - run: npm run smoke
