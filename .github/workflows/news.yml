name: News and sentiment

# Headlines from Finnhub (US stocks, ETFs and the crypto feed), then FinBERT
# sentiment on CPU. Needs the FINNHUB_API_KEY repository secret; without it
# the job does nothing and the app shows that news is not configured.
on:
  schedule:
    - cron: "45 10 * * *"
    - cron: "15 22 * * *"
  workflow_dispatch:

concurrency:
  group: news
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add the DATABASE_URL repository secret."
            exit 1
          fi
          if [ -z "$FINNHUB_API_KEY" ]; then
            echo "::notice::FINNHUB_API_KEY is not set, so there is no news to fetch. Add a free key from finnhub.io as a repository secret."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install
        if: steps.secrets.outputs.enabled == 'true'
        run: |
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements/ml.txt
      - name: Apply migrations
        if: steps.secrets.outputs.enabled == 'true'
        run: alembic upgrade head
      - name: Fetch headlines
        if: steps.secrets.outputs.enabled == 'true'
        run: python -m jobs.refresh_news
      - uses: actions/cache@v4
        if: steps.secrets.outputs.enabled == 'true'
        with:
          path: ~/.cache/huggingface
          key: finbert-v1
      - name: Score sentiment (FinBERT)
        if: steps.secrets.outputs.enabled == 'true' && !cancelled()
        run: python -m jobs.score_sentiment
